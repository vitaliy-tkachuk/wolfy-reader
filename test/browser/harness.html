<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>wolfy-reader view harness</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  #stage { width: 800px; height: 600px; border: 1px solid #ccc; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
  import { open, capturePosition, serializePosition } from '/src/core/index.ts';
  import { epub, fb2, text } from '/src/formats/index.ts';
  import { ContentHost } from '/src/view/index.ts';
  import { Paginator } from '/src/layout/index.ts';
  import { render, parsePosition } from '/src/reader/index.ts';

  // The host must mint no object URLs at all: an opaque-origin frame cannot
  // read the creating origin's blob store, so any that appeared would be both
  // useless and unrevoked. Counting them is how the test proves it.
  let objectUrlsCreated = 0;
  let objectUrlsRevoked = 0;
  const createObjectURL = URL.createObjectURL.bind(URL);
  const revokeObjectURL = URL.revokeObjectURL.bind(URL);
  URL.createObjectURL = (blob) => {
    objectUrlsCreated += 1;
    return createObjectURL(blob);
  };
  URL.revokeObjectURL = (url) => {
    objectUrlsRevoked += 1;
    revokeObjectURL(url);
  };

  const stage = document.querySelector('#stage');
  const violations = [];
  const errors = [];
  const fromFrame = [];
  let host = null;
  let book = null;
  let paginator = null;
  let reader = null;
  // Ordered log of facade events, for asserting firing order + payloads.
  let readerEvents = [];

  window.addEventListener('message', (event) => {
    if (host !== null && event.source === host.frame.contentWindow) fromFrame.push(event.data);
  });

  function decodeBase64(text) {
    return Uint8Array.from(atob(text), (character) => character.charCodeAt(0));
  }

  function syntheticSection(spec) {
    const entries = spec.resources ?? {};
    return {
      id: spec.id ?? 'synthetic',
      mediaType: spec.mediaType ?? 'application/xhtml+xml',
      ...(spec.scripted === true ? { scripted: true } : {}),
      load: async () => new TextEncoder().encode(spec.source),
      resolve: (reference) => {
        const entry = entries[reference];
        if (entry === undefined) return undefined;
        return {
          mediaType: entry.mediaType,
          load: async () =>
            entry.base64 === undefined ? new TextEncoder().encode(entry.text) : decodeBase64(entry.base64),
        };
      },
    };
  }

  window.harness = {
    async openBook(url) {
      const response = await fetch(url);
      if (!response.ok) return null;
      book = await open(await response.arrayBuffer(), { formats: [epub, fb2, text] });
      return book.sections.map((section) => ({
        id: section.id,
        mediaType: section.mediaType,
        scripted: section.scripted === true,
      }));
    },

    async sectionSource(sectionId) {
      return new TextDecoder().decode(await book.section(sectionId).load());
    },

    createHost() {
      if (host !== null) host.destroy();
      violations.length = 0;
      errors.length = 0;
      fromFrame.length = 0;
      objectUrlsCreated = 0;
      objectUrlsRevoked = 0;
      host = new ContentHost(stage, {
        onViolation: (report) => violations.push(report),
        onError: (message) => errors.push(message),
        timeoutMs: 8000,
      });
      return this.isolation();
    },

    render(sectionId) {
      return host.render(book.section(sectionId));
    },

    renderSource(spec) {
      return host.render(syntheticSection(spec));
    },

    measure() {
      return host.measure();
    },

    async ping() {
      await host.ping();
      return true;
    },

    /** Everything the host page can observe about the frame from outside it. */
    isolation() {
      const frame = host.frame;
      const attribute = frame.getAttribute('sandbox');
      let contentDocument;
      try {
        contentDocument = String(frame.contentDocument);
      } catch (error) {
        contentDocument = `throws:${error.name}`;
      }
      let contentWindowDocument;
      try {
        void frame.contentWindow.document;
        contentWindowDocument = 'readable';
      } catch (error) {
        contentWindowDocument = `throws:${error.name}`;
      }
      return {
        sandbox: attribute,
        tokens: attribute === null ? [] : attribute.split(/\s+/).filter(Boolean),
        contentDocument,
        contentWindowDocument,
      };
    },

    observed() {
      return {
        violations: violations.map((report) => ({ ...report })),
        errors: [...errors],
        fromFrame: fromFrame.map((message) => JSON.parse(JSON.stringify(message))),
        objectUrlsCreated,
        objectUrlsRevoked,
      };
    },

    /** A well-formed frame message from the wrong source must not be dispatched. */
    spoofFromTopWindow(id) {
      window.postMessage({ v: 1, type: 'measured', id, width: 1, height: 1 }, '*');
    },

    /**
     * A sibling frame reaching the content frame's window and speaking the
     * protocol at it. The content frame must ignore it: only its parent counts.
     */
    spoofFromSibling(id) {
      return new Promise((done) => {
        const sibling = document.createElement('iframe');
        sibling.setAttribute('sandbox', 'allow-scripts');
        sibling.style.display = 'none';
        document.body.append(sibling);
        sibling.srcdoc = `<script>parent.frames[0].postMessage({ v: 1, type: 'measure', id: ${id} }, '*');<\/script>`;
        // Removed again so the content frame stays the page's only child frame.
        setTimeout(() => {
          sibling.remove();
          done();
        }, 400);
      });
    },

    destroy() {
      host.destroy();
      host = null;
    },

    // --- Paginator surface. A separate Paginator over its own stage so
    // the pagination tests do not disturb the isolation/sanitize harness above.

    /** (Re)creates a Paginator over the stage at the given page geometry. */
    createPaginator() {
      if (paginator !== null) paginator.destroy();
      paginator = new Paginator(stage, { timeoutMs: 15000 });
    },

    /** Paginates a real book section under the given request; returns the state. */
    async paginateSection(sectionId, request) {
      return paginator.paginate(book.section(sectionId), request);
    },

    /** Paginates a synthetic in-memory section (no corpus needed). */
    async paginateSynthetic(spec, request) {
      return paginator.paginate(syntheticSection(spec), request);
    },

    /**
     * Paginates a synthetic section instrumented to count section-byte loads and
     * resource-byte loads — the observable proof of the per-section render-input
     * cache: a same-section reflow must not re-decode or re-mint. Counters are
     * read back with `renderCounters()`.
     */
    async paginateCounted(spec, request) {
      window.__sectionLoads = 0;
      window.__resourceLoads = 0;
      const base = syntheticSection(spec);
      const section = {
        ...base,
        load: async () => {
          window.__sectionLoads += 1;
          return base.load();
        },
        resolve: (reference) => {
          const resource = base.resolve(reference);
          if (resource === undefined) return undefined;
          return {
            ...resource,
            load: async () => {
              window.__resourceLoads += 1;
              return resource.load();
            },
          };
        },
      };
      return paginator.paginate(section, request);
    },

    renderCounters() {
      return { sectionLoads: window.__sectionLoads, resourceLoads: window.__resourceLoads };
    },

    /** Applies a reflowing appearance change through the paginator (see #reapply). */
    async paginatorApplyAppearance(css, geometry = {}) {
      await paginator.applyAppearance(css, geometry);
      return paginator.state;
    },

    /** Switches the paginator's layout mode, preserving position. */
    async paginatorSwitchMode(mode) {
      return paginator.switchMode(mode);
    },

    /**
     * Decorates the standalone paginator over a Position captured at a UTF-16
     * offset into its own section text, then reports diagnostics — used to prove
     * a decoration in a late chunk realizes only its target chunk.
     */
    async paginatorDecorateAt(id, offset, className) {
      const text = await paginator.sectionText();
      const position = capturePosition(text, offset, paginator.section.id);
      await paginator.decorate(id, position, className);
      return paginator.diagnostics();
    },

    async refine() {
      return paginator.refine();
    },

    /**
     * Forces a full re-layout. `refine()` returns immediately once the state is
     * firm, so it cannot be used to measure what a re-layout costs — a timing
     * assertion built on it passes without doing any work.
     */
    async relayout() {
      return paginator.relayout();
    },

    async goToPage(page) {
      return paginator.goToPage(page);
    },

    get page() {
      return paginator.page;
    },

    async positionOfPage(page) {
      const position = await paginator.positionOfPage(page);
      return { serialized: position.serialized, sectionId: position.sectionId };
    },

    async pageOfPositionAt(page) {
      const position = await paginator.positionOfPage(page);
      return paginator.pageOfPosition(position);
    },

    chapterProgress() {
      return paginator.chapterProgress();
    },

    async paginatorDiagnostics() {
      return paginator.diagnostics();
    },

    async paginatorSectionText() {
      return paginator.sectionText();
    },

    destroyPaginator() {
      if (paginator !== null) paginator.destroy();
      paginator = null;
    },

    // --- Reader facade surface. The public reader over the opened book,
    // rendered into the same stage. Events are logged in order for assertions.

    /**
     * Renders the opened book through the public facade, logging every event in
     * order. Resolves once `ready` has fired (the first section painted).
     */
    async createReader(options = {}) {
      if (reader !== null) reader.destroy();
      readerEvents = [];
      reader = render(book, stage, options);
      const record = (type) => (payload) => {
        readerEvents.push({ type, payload: JSON.parse(JSON.stringify(payload ?? null)) });
      };
      for (const type of ['ready', 'positionchange', 'sectionchange', 'linkclick', 'selection', 'selectionclear', 'tap', 'decorationtap']) {
        reader.on(type, record(type));
      }
      reader.on('error', (err) => readerEvents.push({ type: 'error', payload: String(err?.message ?? err) }));
      await new Promise((done) => {
        const off = reader.on('ready', () => {
          off();
          done();
        });
      });
      return reader.position;
    },

    /** Clears the event log (call before an action whose event order is asserted). */
    clearReaderEvents() {
      readerEvents = [];
      return true;
    },

    readerEvents() {
      return readerEvents.map((entry) => ({ ...entry }));
    },

    readerPosition() {
      return reader.position;
    },

    /** The 0-based reading-order index of a section id. */
    sectionIndexOf(sectionId) {
      return book.sections.findIndex((section) => section.id === sectionId);
    },

    /** The opened book's reading direction ('ltr' | 'rtl' | undefined). */
    bookDirection() {
      return book.direction;
    },

    readerMode() {
      return reader.mode;
    },

    async readerNext() {
      await reader.next();
      return reader.position;
    },

    async readerPrev() {
      await reader.prev();
      return reader.position;
    },

    async readerNextSection() {
      await reader.nextSection();
      return reader.position;
    },

    async readerPrevSection() {
      await reader.prevSection();
      return reader.position;
    },

    async readerGoTo(target) {
      await reader.goTo(target);
      return reader.position;
    },

    /**
     * Rebuilds a Position from its opaque serialized string and navigates to it —
     * the round trip a host performs when restoring a persisted selection anchor.
     * Returns the settled reader position.
     */
    async readerGoToSerialized(serialized) {
      await reader.goTo(parsePosition(serialized));
      return reader.position;
    },

    async readerBack() {
      await reader.back();
      return reader.position;
    },

    /**
     * Streams up to `limit` hits from reader.search(query), returning each hit's
     * serialized Position + section index (the Position rebuilds on the host side to
     * drive goTo). Proves the iterator is consumable across the boundary; laziness
     * and hit shape are covered headlessly. `limit` guards a runaway scan.
     */
    async readerSearch(query, limit = 20) {
      const hits = [];
      for await (const hit of reader.search(query)) {
        hits.push({
          text: hit.text,
          context: hit.context,
          sectionIndex: hit.sectionIndex,
          serialized: hit.position.serialized,
        });
        if (hits.length >= limit) break;
      }
      return hits;
    },

    /** Rebuilds a hit's Position from its serialized string and jumps to it. */
    async readerGoToSearchHit(serialized) {
      await reader.goTo(parsePosition(serialized));
      return reader.position;
    },

    async readerSetMode(mode) {
      await reader.setMode(mode);
      return reader.position;
    },

    /**
     * Draws a decoration over the range a serialized Position resolves to — the
     * round trip a host performs to highlight a stored anchor. Rebuilds the Position
     * from its opaque string, so this proves the public decorate() surface end to end.
     */
    async readerDecorate(id, serialized, className) {
      await reader.decorate(id, parsePosition(serialized), { className });
      return true;
    },

    async readerUndecorate(id) {
      await reader.undecorate(id);
      return true;
    },

    /** Sentence ranges for the current section, positions serialized for the wire. */
    async readerSentences() {
      const sentences = await reader.sentences();
      return sentences.map((s) => ({ text: s.text, position: serializePosition(s.position) }));
    },

    /**
     * A serialized Position anchored to the active section's id but over text that is
     * absent from it — so resolvePosition returns undefined against the real section
     * text. Feeding it to decorate() is a genuine resolve soft-miss: the frame is told
     * to draw nothing, and decorate throws nothing. Returns null before the first paint.
     */
    /**
     * A serialized Position anchored at UTF-16 offset `offset` in the caller-supplied
     * `text`, tagged with the active section's id — so decorate() over it resolves
     * back against that section. The test reads the frame's chunk text, finds a real
     * phrase, and passes its offset here; this is exactly the capture leg the selection
     * path performs, but with a test-chosen anchor point. Returns null before paint.
     */
    buildPositionAt(text, offset) {
      if (reader === null || book === null) return null;
      const sectionId = book.sections[reader.position.section]?.id;
      if (sectionId === undefined) return null;
      return serializePosition(capturePosition(text, offset, sectionId));
    },

    buildAbsentPosition() {
      if (reader === null || book === null) return null;
      const sectionId = book.sections[reader.position.section]?.id;
      if (sectionId === undefined) return null;
      const position = capturePosition(
        'a phrase that certainly does not occur anywhere in this particular book fixture zzqx',
        0,
        sectionId,
      );
      return serializePosition(position);
    },

    /** Applies a live appearance change; resolves once it settles. */
    async readerSetAppearance(appearance) {
      await reader.setAppearance(appearance);
      return reader.position;
    },

    /**
     * Renders a single synthetic section straight through the facade, so a
     * hostile-CSS or bespoke fixture can be themed without a corpus book. Resolves
     * once `ready` fires. Returns the initial position.
     */
    async createReaderWithSection(spec, options = {}) {
      if (reader !== null) reader.destroy();
      readerEvents = [];
      const section = syntheticSection(spec);
      const oneSectionBook = {
        metadata: {},
        toc: [],
        sections: [section],
        section: () => section,
        direction: spec.direction,
      };
      reader = render(oneSectionBook, stage, options);
      await new Promise((done) => {
        const off = reader.on('ready', () => {
          off();
          done();
        });
      });
      return reader.position;
    },

    destroyReader() {
      if (reader !== null) reader.destroy();
      reader = null;
    },

    /** Snapshot of what a destroyed reader must have left clean. */
    leakProbe() {
      return {
        iframes: document.querySelectorAll('iframe').length,
        // Any data: URL still referenced anywhere in a live frame would show here;
        // the facade uses no host-minted object URLs, so this stays 0.
        objectUrlsCreated,
        objectUrlsRevoked,
      };
    },
  };

  window.harnessReady = true;
</script>
</body>
</html>
