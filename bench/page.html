<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>wolfy-reader pagination benchmark</title>
    <style>
      /* Every animation path is off: a transition or a smooth scroll would land
         paint work in a later frame and be attributed to the wrong page turn. */
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff;
        color: #111;
        font: 13px/1.4 system-ui, sans-serif;
      }

      /* The reader-shaped viewport. Both strategies get this exact box, this
         exact font stack and this exact column geometry — the only thing that
         differs between them is what they put inside. */
      #viewport {
        position: relative;
        overflow: hidden;
        box-sizing: content-box;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: var(--bench-font-size, 16px);
        line-height: 1.5;
        text-align: justify;
        hyphens: auto;
      }

      #viewport p {
        margin: 0 0 0.9em;
      }

      #viewport h1,
      #viewport h2,
      #viewport h3 {
        margin: 1.2em 0 0.6em;
        font-size: 1.25em;
        line-height: 1.3;
        text-align: left;
      }

      #viewport img {
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="viewport"></div>
    <script type="module" src="./harness.js"></script>
  </body>
</html>
